name: apiverve_openlicenses
description: "Open Source Licenses is a software license API that looks up open source license details by name or identifier. It returns SPDX identifiers, canonical URLs, OSI approval status, legacy IDs, and domain applicability for software, content, or data."
version: 1.2.5
homepage: https://apiverve.com/marketplace/openlicenses?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/openlicenses-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
